name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  pull-requests: read   # the reusable quality.yml declares this; a called
                        # workflow cannot request more than the caller grants.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Validate tag and branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.derive.outputs.version }}
      numeric_version: ${{ steps.derive.outputs.numeric_version }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive and validate version from tag
        id: derive
        run: ./scripts/release/derive-version.sh "$GITHUB_REF" >> "$GITHUB_OUTPUT"

      - name: Require tag commit to be on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "error: tagged commit $GITHUB_SHA is not reachable from main; refusing to release." >&2
            exit 1
          fi

  validate:
    name: Required checks
    needs: guard
    uses: ./.github/workflows/quality.yml
    with:
      version: ${{ needs.guard.outputs.version }}
    secrets: inherit

  publish:
    name: Build, stage, and release
    needs: [guard, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The upload token + API origin live in the "PULSE" environment, so this job
    # must declare it to access secrets.REPO_UPLOAD_TOKEN and vars.PULSE_API_ORIGIN.
    environment: PULSE
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Build and assemble Linux staging tree
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: ./scripts/release/stage-linux.sh "$VERSION"

      # Staging upload is PAUSED: large artifacts (~100 MB .deb) exceed
      # Cloudflare's ~100s proxy timeout (524). Re-enable by setting the repo
      # variable ENABLE_STAGING_UPLOAD=true once uploads go through a
      # Cloudflare-bypass origin or presigned MinIO URLs. Until then, releases
      # are published only as GitHub Release assets (below).
      - name: Publish staging artifacts to PULSE repo
        if: vars.ENABLE_STAGING_UPLOAD == 'true'
        env:
          REPO_UPLOAD_TOKEN: ${{ secrets.REPO_UPLOAD_TOKEN }}
          PULSE_API_ORIGIN: ${{ vars.PULSE_API_ORIGIN }}
        run: |
          set -euo pipefail
          # PUT each staging file to the repo API under a "staging/<relative>" key
          # so its public URL is ${PULSE_API_ORIGIN}/download/staging/<relative>,
          # matching the APT URL baked into the generated install.sh.
          cd dist/staging
          find . -type f | sed 's#^\./##' | sort > "$RUNNER_TEMP/keys.txt"
          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            echo "==> Publishing staging/$rel"
            # --http1.1: large bodies (the ~100 MB .deb/zips) hit HTTP/2
            #   PROTOCOL_ERROR through the proxy; HTTP/1.1 uploads cleanly.
            # --retry: tolerate transient upload blips on big files.
            curl --fail-with-body -sS --http1.1 \
              --retry 3 --retry-all-errors --retry-delay 5 \
              -X PUT \
              -H "Authorization: Bearer ${REPO_UPLOAD_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$rel" \
              "${PULSE_API_ORIGIN}/api/repo/objects/staging/${rel}"
            echo
          done < "$RUNNER_TEMP/keys.txt"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "error: release v$VERSION already exists; versions are immutable." >&2
            exit 1
          fi
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "Automated Linux release v$VERSION: self-contained arm64 .deb, per-arch zips (x64/arm/arm64), and SHA256SUMS. (Staging-repo upload is paused; see ENABLE_STAGING_UPLOAD.)" \
            $prerelease \
            "dist/staging/debian/pulse-edge_${VERSION}_arm64.deb" \
            "dist/staging/linux/pulse-edge-linux-x64.zip" \
            "dist/staging/linux/pulse-edge-linux-arm.zip" \
            "dist/staging/linux/pulse-edge-linux-arm64.zip" \
            "dist/staging/SHA256SUMS"
